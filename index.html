<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f2f4;--surface:#fff;--ink:#0d1b2a;--muted:#4f6172;--line:#cadbe1;--teal:#0e7c7b;--teal2:#14a3a1;--orange:#f26b3a;--tint:#cfe9ea;--on-teal:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1620;--surface:#112230;--ink:#eaf2f7;--muted:#9bb0c0;--line:#1f3446;--teal:#3cc7c4;--teal2:#1c9c9a;--orange:#ff8a5c;--tint:#0f2f38;--on-teal:#06222a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1620;--surface:#112230;--ink:#eaf2f7;--muted:#9bb0c0;--line:#1f3446;--teal:#3cc7c4;--teal2:#1c9c9a;--orange:#ff8a5c;--tint:#0f2f38;--on-teal:#06222a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(84px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:Sora,Manrope,system-ui,sans-serif;margin:0;line-height:1.15}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 26px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:24px;height:68px}
.logo{font:800 1.15rem Sora,sans-serif;text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:10px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--teal2));color:var(--on-teal);display:grid;place-items:center;font:700 .85rem Sora,sans-serif;font-style:normal}
nav{display:flex;gap:26px}
nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:.97rem}
nav a:hover{color:var(--teal)}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:600;font-size:.92rem}
section{padding:92px 0 0}
.hero{padding-top:64px;display:grid;grid-template-columns:1.3fr 1fr;gap:56px;align-items:center}
.role{display:inline-block;background:var(--tint);color:var(--teal);font-weight:700;font-size:.95rem;padding:6px 16px;border-radius:999px;margin:0 0 18px}
h1{font-size:clamp(2rem,4.6vw,3.4rem);font-weight:800;letter-spacing:-.02em}
.lead{color:var(--muted);max-width:58ch;margin:22px 0 30px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 26px;border-radius:12px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.main{background:linear-gradient(135deg,var(--teal),var(--teal2));color:var(--on-teal);border:0;box-shadow:0 10px 24px -10px var(--teal)}
.visual{position:relative;max-width:400px;margin-left:auto;width:100%}
.visual::before{content:"";position:absolute;inset:-18px 24px 24px -18px;border-radius:44px;background:linear-gradient(150deg,var(--tint),transparent 80%);border:1px solid var(--line)}
.photo{position:relative;aspect-ratio:4/5;border-radius:36px;overflow:hidden;background:var(--tint);display:grid;place-items:center;box-shadow:0 30px 60px -30px rgba(13,27,42,.5)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.photo span{font:800 5rem Sora,sans-serif;color:var(--teal)}
.badge{position:absolute;right:-14px;bottom:36px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 18px;box-shadow:0 18px 36px -18px rgba(13,27,42,.45);font-weight:700;font-size:.95rem;display:flex;gap:10px;align-items:center}
.badge::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:64px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--teal),var(--orange))}
.stat b{display:block;font:800 2.2rem Sora,sans-serif;color:var(--teal);line-height:1.1}
.stat span{display:block;color:var(--muted);margin-top:8px;line-height:1.45;font-size:.97rem}
h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800;margin-bottom:32px;letter-spacing:-.01em}
h2::after{content:"";display:block;width:54px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--orange));margin-top:14px}
.about{display:grid;grid-template-columns:1fr 1.5fr;gap:52px;align-items:center}
.about .photo{border-radius:32px}
.about p{margin:0 0 16px;max-width:62ch}
.timeline{list-style:none;margin:0;padding:0 0 0 34px;position:relative}
.timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(var(--teal),var(--orange))}
.timeline li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 26px;margin-bottom:16px}
.timeline li::before{content:"";position:absolute;left:-34px;top:26px;width:21px;height:21px;border-radius:50%;background:var(--bg);border:4px solid var(--teal)}
.timeline li:first-child::before{background:var(--orange);border-color:var(--orange)}
.timeline small{color:var(--teal);font-weight:700}
.timeline h3{font-size:1.2rem;margin:4px 0 2px}
.timeline p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 22px;font-weight:700}
.tab[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--teal)}
.ico{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--tint);color:var(--teal);margin-bottom:14px}.ico svg{width:26px;height:26px}.ico.brand{background:#fff;border:1px solid var(--line)}
.card h3{font-size:1.02rem;margin-bottom:8px}
.card p{margin:0;color:var(--muted);font-size:.96rem;line-height:1.55}
.cert{display:flex;gap:14px;align-items:center}
.cert i{flex:none;width:42px;height:42px;border-radius:12px;background:var(--tint);color:var(--teal);display:grid;place-items:center;font-style:normal;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tag{display:inline-block;color:var(--orange);font-weight:700;margin-bottom:4px}
.two .card a{display:inline-block;margin-top:14px;color:var(--teal);font-weight:700}
.connect{margin-top:100px;border-radius:32px;padding:64px 48px;color:#fff;background:linear-gradient(135deg,#0b5f5e,#0e7c7b 55%,#14a3a1);position:relative;overflow:hidden}
.connect::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(242,107,58,.35)}
.connect h2{color:#fff;margin-bottom:14px;position:relative}
.connect h2::after{display:none}
.connect p{margin:0 0 28px;max-width:54ch;color:#d6f1f0;position:relative}
.connect .btn{margin:0 10px 12px 0;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4);position:relative}
.connect .btn.main{background:#fff;color:#0b5f5e;box-shadow:none}
footer{padding:48px 0;text-align:center;color:var(--muted);font-size:.93rem}
@media (max-width:820px){.hero,.about,.two{grid-template-columns:1fr}.visual{margin:12px auto 0;max-width:320px}.stats{grid-template-columns:1fr}nav{display:none}.connect{padding:44px 26px}.badge{right:-6px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.card{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
<a class="logo" href="#home"><i id="mono"></i><span id="logo"></span></a>
<nav aria-label="Sections"><a href="#about">About</a><a href="#journey">Journey</a><a href="#expertise">Expertise</a><a href="#connect">Contact</a></nav>
<button class="theme" id="theme" aria-label="Switch between light and dark mode">Dark mode</button>
</div></header>

<main class="wrap">
<section id="home" class="hero">
<div>
<p class="role" id="role"></p>
<h1 id="headline"></h1>
<p class="lead" id="intro"></p>
<div class="btns"><a class="btn main" href="#journey">View experience</a><a class="btn" href="#connect">Contact me</a></div>
</div>
<div class="visual"><div class="photo" id="photo"></div><div class="badge" id="badge"></div></div>
</section>
<div class="stats" id="stats"></div>

<section id="about"><h2>About me</h2>
<div class="about"><div class="photo" id="photo2"></div><div id="about"></div></div></section>

<section id="journey"><h2>Career path</h2><ol class="timeline" id="timeline"></ol></section>

<section id="expertise"><h2>What I work with</h2>
<div class="tabs" id="tabs"></div><div class="grid" id="skills"></div></section>

<section id="credentials"><h2>Certifications</h2><div class="grid" id="certs"></div></section>

<section id="beyond"><h2>Writing and mentoring</h2><div class="two" id="beyond"></div></section>

<div class="connect" id="connect"><h2 id="cta-title"></h2><p id="cta-text"></p><div id="links"></div></div>
</main>
<footer id="foot"></footer>

function iconFor(name){
  const n = name.toLowerCase();
  if(n.includes("spark")) return {b:"spark"};
  if(n.includes("snowflake")) return {b:"snowflake"};
  if(n.includes("python")) return {b:"python"};
  if(n.includes("tableau")||n.includes("power bi")) return {g:"chart"};
  if(n.includes("domo")||n.includes("alteryx")) return {g:"flow"};
  if(n.includes("sql")) return {g:"db"};
  if(n.includes("model")||n.includes("warehous")) return {g:"model"};
  if(n.includes("chatbot")) return {g:"chat"};
  if(/\bai\b|ai-/.test(n)) return {g:"spark"};
  if(n.includes("intelligence")) return {g:"dash"};
  return {g:"dash"};
}
function iconHTML(name){
  const k = iconFor(name);
  if(k.b){ const b = ICONS.brand[k.b]; return `<span class="ico brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${b.c}" d="${b.d}"/></svg></span>`; }
  return `<span class="ico">${ICONS.glyph[k.g]}</span>`;
}
const cats = ["All", ...new Set(D.skills.map(s => s[0]))];
let cur = "All";
function drawSkills(){
  $("tabs").innerHTML = cats.map(c => `<button class="tab" aria-pressed="${c===cur}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("skills").innerHTML = D.skills.filter(s => cur==="All"||s[0]===cur).map(s => `<div class="card">${iconHTML(s[1])}<h3>${esc(s[1])}</h3><p>${esc(s[2])}</p></div>`).join("");
}
$("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if(b){ cur = b.dataset.c; drawSkills(); } });
drawSkills();
$("certs").innerHTML = D.certs.map(c => `<div class="card cert"><i>✓</i><h3>${esc(c)}</h3></div>`).join("");
$("beyond").innerHTML = D.beyond.map(b => `<div class="card"><span class="tag">${esc(b[0])}</span><h3>${esc(b[1])}</h3><p style="margin-top:8px">${esc(b[2])}</p><a href="${esc(b[3])}" target="_blank" rel="noopener">${esc(b[4])}</a></div>`).join("");
$("cta-title").textContent = D.ctaTitle;
$("cta-text").textContent = D.ctaText;
$("links").innerHTML = D.links.map((l,i) => `<a class="btn${i===0?" main":""}" href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join("");

const root = document.documentElement, tb = $("theme");
